; Produktions-PHP-Konfiguration (gilt für base + production)
; Ziel: Fehler/Deprecations landen im Log, niemals im Response-Body.
; Hintergrund: PHP 8.5 deprecated curl_close(); der Vendor-Library-Code
; (allyans3/steam-market-api-v2) ruft es weiterhin auf. Mit display_errors=On
; wird die Notice vor den JSON-Body geschrieben und bricht die API-Antwort.

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/logs/php-error.log
error_reporting = E_ALL

expose_php = Off
memory_limit = 256M

date.timezone = UTC